aid: anycart
name: Anycart
description: >-
  Anycart is a consumer grocery delivery and store-pickup platform that lets
  shoppers enter a zip code, choose a favorite local grocery store, and shop for
  anything they need with no price markups and no service fees. The service spans
  multiple U.S. retailers and focuses on transparent pricing for everyday grocery
  ordering, delivery, and pickup. Anycart was surfaced as a portfolio company of
  Menlo Ventures and Techstars and added to the API Evangelist network for
  enrichment. It operates a consumer web and mobile storefront (anycart.com) and
  does not publish a public developer program, OpenAPI definition, or API
  documentation at this time.
